[project]
name = "carbu"
version = "1.0.0a3"
description = "Carnet de bord véhicule pour Home Assistant"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PL", "PT", "D", "ASYNC", "DTZ",
]
ignore = [
    "D203", "D213", "D401", "RUF001", "RUF002", "RUF003", "PLR0913", "PLR2004", "PLR0911", "PLR0912",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004", "PLR0917", "DTZ"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
force-sort-within-sections = true
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
files = ["custom_components/carbu"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
